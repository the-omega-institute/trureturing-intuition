name: structure-edit-candidate-gate

on:
  pull_request:
    paths:
      - "src/Trureturing.Intuition.Core/StructureEditCandidate*.cs"
      - "src/Trureturing.Intuition.Core/ContractValidator.StructureEditCandidate.cs"
      - "tools/Trureturing.Intuition.StructureEditCandidate/**"
      - "tests/Trureturing.Intuition.StructureEditCandidateTests/**"
      - "contracts/structure-edit-candidate.v1.schema.json"
      - ".fkst/local-packages/trureturing-intuition/raisers/structure_edit_candidates.lua"
      - ".fkst/local-packages/trureturing-intuition/departments/structure-edit-candidate-intake/**"
      - ".github/workflows/structure-edit-candidate.yml"

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build Core and registrar with warnings as errors
        run: |
          dotnet build src/Trureturing.Intuition.Core/Trureturing.Intuition.Core.csproj -c Release --warnaserror
          dotnet build tools/Trureturing.Intuition.StructureEditCandidate/Trureturing.Intuition.StructureEditCandidate.csproj -c Release --warnaserror
      - name: Run episode, evidence, and graph-patch closure tests
        run: >-
          dotnet run
          --project tests/Trureturing.Intuition.StructureEditCandidateTests
          -c Release
