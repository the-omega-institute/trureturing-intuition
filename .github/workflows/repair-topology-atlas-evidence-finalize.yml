name: repair-topology-atlas-evidence-finalize

on:
  push:
    branches:
      - feat/topology-atlas-evidence-input
    paths:
      - .github/workflows/repair-topology-atlas-evidence-finalize.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/topology-atlas-evidence-input
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Repair, validate, and annotate the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin feat/topology-atlas-evidence-input
          python - <<'PY'
          from pathlib import Path
          path = Path("src/Trureturing.Intuition.Core/TopologyAtlasEvidence.cs")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "witnessCount is >= 1 and <= 64",
              "witnessCount >= BigInteger.One && witnessCount <= new BigInteger(64)",
          )
          path.write_text(text, encoding="utf-8")
          PY
          dotnet build src/Trureturing.Intuition.Core/Trureturing.Intuition.Core.csproj -c Release --warnaserror
          dotnet build tools/Trureturing.Intuition.TopologyAtlasEvidenceInput/Trureturing.Intuition.TopologyAtlasEvidenceInput.csproj -c Release --warnaserror
          dotnet run --project tests/Trureturing.Intuition.TopologyAtlasEvidenceInputTests -c Release
          dotnet run --project tests/Trureturing.Intuition.Tests -c Release
          rm -f \
            .github/workflows/finalize-topology-atlas-evidence.yml \
            .github/workflows/repair-topology-atlas-evidence-finalize.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(intuition): finalize exact Atlas evidence input"
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:feat/topology-atlas-evidence-input; then break; fi
            git pull --rebase origin feat/topology-atlas-evidence-input
            if [[ "$attempt" == 3 ]]; then exit 1; fi
          done
          pr="$(gh pr list --head feat/topology-atlas-evidence-input --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            gh pr create \
              --base feat/structure-edit-episodes \
              --head feat/topology-atlas-evidence-input \
              --title "feat(intuition): register exact topology atlas evidence inputs" \
              --draft \
              --body "Exact stable identities, structural traits, cluster interfaces, and affinity witnesses are registered against the release-bound Atlas. Independent Core, hostile-input, and lifecycle gates pass. No auto-merge."
          else
            gh pr comment "$pr" --body "Current-head validation passed: Core and registrar build with warnings as errors, exact registration and hostile-input tests pass, and the existing lifecycle suite remains green."
          fi
