name: materialize-founding-tree

on:
  push:
    branches:
      - feat/founding-intuition-organ

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/founding-intuition-organ
          fetch-depth: 0
      - name: Materialize complete repository
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* > "$RUNNER_TEMP/trureturing-intuition.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/trureturing-intuition.tar.gz.b64" > "$RUNNER_TEMP/trureturing-intuition.tar.gz"
          echo "ff53f5d9feaee3c35f942307ae92156ec6eeda9ca9e8d26e697cc4b51bcce974  $RUNNER_TEMP/trureturing-intuition.tar.gz" | sha256sum --check -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf "$RUNNER_TEMP/trureturing-intuition.tar.gz" -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: found verifier-grounded intuition organ"
          git push origin HEAD:feat/founding-intuition-organ
